
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Happy Birthday</title>

    <link rel="stylesheet" href="estilo.css">
</head>

<body class="cumpleanos">

    <!-- CONFETI -->
    <div id="confeti-container"></div>

    <main class="contenedor-cumple">

        <header class="encabezado-cumple">
            <p class="subtitulo">A SPECIAL DAY FOR SOMEONE SPECIAL</p>

            <h1>Happy Birthday</h1>

            <div class="separador">
                <span></span>
                <div></div>
                <span></span>
            </div>


        <!-- IMAGEN PRINCIPAL -->
        <section class="seccion-dibujo">

            <div class="marco-dibujo">
                <img
                    src="luchi definitiva.png"
                    alt="Ilustración especial"
                    class="dibujo"
                >
            </div>

        </section>


        <!-- DEDICATORIA -->
        <section class="dedicatoria">

            <p>
                Feli cumple luchi querida
                espero q la pases re piola en tu dia y
                bueno queria hacerte un mini regalo ajskasjk
            </p>

            <span class="firma">Att: Hermi.</span>

        </section>


        <!-- REPRODUCTOR DE MÚSICA -->
        <section class="reproductor">

            <div class="reproductor-superior">

                <div class="icono-musica">
                    ♪
                </div>

                <div class="informacion-musica">
                    <h3>Happy Birthday</h3>
                    <p>Una canción para vos</p>
                </div>

                <button
                    id="boton-play"
                    class="boton-play"
                    aria-label="Reproducir música"
                >
                    ▶
                </button>

            </div>


            <div class="barra-tiempo">

                <span id="tiempo-actual">0:00</span>

                <input
                    type="range"
                    id="barra-progreso"
                    min="0"
                    max="100"
                    value="0"
                >

                <span id="duracion">0:00</span>

            </div>


            <div class="control-volumen">

                <span>♪</span>

                <input
                    type="range"
                    id="volumen"
                    min="0"
                    max="1"
                    step="0.01"
                    value="0.5"
                >

                <span>♫</span>

            </div>

        </section>


        <footer class="pie-cumple">
            Made with love
        </footer>

    </main>


    <!-- AUDIO -->
    <audio id="musica" loop preload="auto">
        <source src="cumple.mp3" type="audio/mpeg">
        Tu navegador no soporta audio.
    </audio>


    <!-- JAVASCRIPT INTEGRADO -->
    <script>

        // =====================================
        // CONFETI
        // =====================================

        const confetiContainer = document.getElementById("confeti-container");

        const colores = [
            "#8ED9C8",
            "#5BAFA5",
            "#B4E7D8",
            "#D3F0E7",
            "#397F79",
            "#A0CFC3"
        ];

        function lanzarConfeti() {

            const cantidad = 90;

            for (let i = 0; i < cantidad; i++) {

                const confeti = document.createElement("span");

                confeti.classList.add("confeti");

                confeti.style.left = Math.random() * 100 + "vw";

                confeti.style.backgroundColor =
                    colores[Math.floor(Math.random() * colores.length)];

                confeti.style.animationDuration =
                    (Math.random() * 3 + 3) + "s";

                confeti.style.animationDelay =
                    Math.random() * 1.5 + "s";

                confeti.style.width =
                    (Math.random() * 7 + 5) + "px";

                confeti.style.height =
                    (Math.random() * 10 + 6) + "px";

                confeti.style.transform =
                    `rotate(${Math.random() * 360}deg)`;

                confetiContainer.appendChild(confeti);

                setTimeout(() => {
                    confeti.remove();
                }, 7500);

            }
        }

        // Confeti al ingresar
        window.addEventListener("load", () => {
            lanzarConfeti();
        });


        // =====================================
        // REPRODUCTOR DE MÚSICA
        // =====================================

        const musica = document.getElementById("musica");

        const botonPlay = document.getElementById("boton-play");

        const barraProgreso = document.getElementById("barra-progreso");

        const volumen = document.getElementById("volumen");

        const tiempoActual = document.getElementById("tiempo-actual");

        const duracion = document.getElementById("duracion");


        // Formato minutos y segundos
        function formatoTiempo(segundos) {

            if (!Number.isFinite(segundos)) return "0:00";

            const minutos = Math.floor(segundos / 60);

            const segundosRestantes = Math.floor(segundos % 60);

            return minutos + ":" +
                segundosRestantes.toString().padStart(2, "0");
        }


        // Reproducir música
        async function reproducirMusica() {

            try {

                await musica.play();

                botonPlay.textContent = "Ⅱ";

                botonPlay.setAttribute("aria-label", "Pausar música");

            } catch (error) {

                console.log("El navegador necesita una interacción para reproducir audio.");

                botonPlay.textContent = "▶";

            }

        }


        // Pausar música
        function pausarMusica() {

            musica.pause();

            botonPlay.textContent = "▶";

            botonPlay.setAttribute("aria-label", "Reproducir música");

        }


        // Botón Play / Pause
        botonPlay.addEventListener("click", () => {

            if (musica.paused) {

                reproducirMusica();

            } else {

                pausarMusica();

            }

        });


        // Intentar reproducción automática
        window.addEventListener("load", () => {

            reproducirMusica();

        });


        // Actualizar duración
        musica.addEventListener("loadedmetadata", () => {

            duracion.textContent = formatoTiempo(musica.duration);

        });


        // Actualizar barra de progreso
        musica.addEventListener("timeupdate", () => {

            if (!musica.duration) return;

            const progreso =
                (musica.currentTime / musica.duration) * 100;

            barraProgreso.value = progreso;

            tiempoActual.textContent =
                formatoTiempo(musica.currentTime);

        });


        // Adelantar o retroceder canción
        barraProgreso.addEventListener("input", () => {

            if (!musica.duration) return;

            musica.currentTime =
                (barraProgreso.value / 100) * musica.duration;

        });


        // Control de volumen
        volumen.addEventListener("input", () => {

            musica.volume = volumen.value;

        });

        // Volumen inicial
        musica.volume = 0.5;

    </script>

</body>
</html>
